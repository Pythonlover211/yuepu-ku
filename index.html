<!DOCTYPE html>
<html lang="zh-CN" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f1a" id="metaThemeColor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="乐谱库" />
  <meta name="description" content="一款优雅的乐谱与图片管理应用，支持分类存储、多主题、自定义背景。" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>乐谱库 · MusicScore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<!-- ░░░ BACKGROUND LAYER ░░░ -->
<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay" id="bgOverlay"></div>

<!-- ░░░ SIDEBAR OVERLAY (mobile) ░░░ -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ░░░ SIDEBAR ░░░ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <span class="logo-text">乐谱库</span>
    </div>
    <button class="icon-btn sidebar-toggle-btn" id="sidebarToggle" title="收起">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-search">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" class="search-icon-svg">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="globalSearch" placeholder="搜索乐谱…" autocomplete="off" />
      <button class="search-clear" id="searchClear" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="sidebar-nav">
    <!-- Browse -->
    <div class="nav-section">
      <p class="nav-label">浏览</p>
      <button class="nav-item active" data-filter="all" id="navAll">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
        <span class="nav-item-text">全部</span>
        <span class="badge" id="badgeAll">0</span>
      </button>
      <button class="nav-item" data-filter="favorites" id="navFavorites">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2"/></svg>
        <span class="nav-item-text">收藏</span>
        <span class="badge" id="badgeFav">0</span>
      </button>
      <button class="nav-item" data-filter="recent" id="navRecent">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="nav-item-text">最近</span>
        <span class="badge" id="badgeRecent">0</span>
      </button>
    </div>

    <!-- Categories -->
    <div class="nav-section">
      <div class="nav-section-header">
        <p class="nav-label">分类</p>
        <button class="icon-btn sm" id="addCategoryBtn" title="新建分类">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="categoryList"></div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="settings-trigger" id="settingsBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/></svg>
      <span>设置与主题</span>
    </button>
    <div class="storage-bar-wrap">
      <div class="storage-labels"><span>本地存储</span><span id="storageSize">0 B</span></div>
      <div class="storage-bar"><div class="storage-fill" id="storageFill"></div></div>
    </div>
  </div>
</aside>

<!-- ░░░ MAIN ░░░ -->
<main class="main" id="mainContent">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn mobile-menu" id="mobileMenuBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div>
        <h1 class="page-title" id="pageTitle">全部乐谱</h1>
        <p class="page-subtitle" id="pageSubtitle">管理您的所有乐谱与图片</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="view-toggle">
        <button class="view-btn active" id="viewGrid" title="网格">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="view-btn" id="viewList" title="列表">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="date-desc">最新优先</option>
        <option value="date-asc">最早优先</option>
        <option value="name-asc">名称 A→Z</option>
        <option value="name-desc">名称 Z→A</option>
      </select>
      <button class="upload-btn" id="uploadBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="upload-btn-text">上传乐谱</span>
      </button>
    </div>
  </header>

  <!-- Grid -->
  <div class="content-area" id="contentArea">
    <div class="score-grid" id="scoreGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
      </div>
      <h3 id="emptyTitle">还没有乐谱</h3>
      <p id="emptyDesc">点击右上角「上传乐谱」，开始整理您的曲谱收藏！</p>
      <button class="upload-btn large" id="emptyUploadBtn" style="display:none">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        上传第一张乐谱
      </button>
    </div>
  </div>
</main>

<!-- ░░░ DRAG OVERLAY ░░░ -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-box">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p>松开即可上传</p>
  </div>
</div>

<!-- ░░░ SETTINGS PANEL ░░░ -->
<div class="panel-backdrop" id="settingsBackdrop"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="panel-header">
    <h2>设置与主题</h2>
    <button class="icon-btn" id="settingsClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <!-- Theme -->
    <div class="settings-section">
      <h3 class="settings-section-title">🎨 主题风格</h3>
      <div class="theme-grid" id="themeGrid">
        <button class="theme-card active" data-theme="midnight">
          <div class="theme-preview midnight-preview"></div>
          <span>深夜</span>
        </button>
        <button class="theme-card" data-theme="daylight">
          <div class="theme-preview daylight-preview"></div>
          <span>白昼</span>
        </button>
        <button class="theme-card" data-theme="amethyst">
          <div class="theme-preview amethyst-preview"></div>
          <span>紫晶</span>
        </button>
        <button class="theme-card" data-theme="ocean">
          <div class="theme-preview ocean-preview"></div>
          <span>海洋</span>
        </button>
        <button class="theme-card" data-theme="warm">
          <div class="theme-preview warm-preview"></div>
          <span>暖金</span>
        </button>
        <button class="theme-card" data-theme="emerald">
          <div class="theme-preview emerald-preview"></div>
          <span>翡翠</span>
        </button>
      </div>
    </div>

    <!-- Background -->
    <div class="settings-section">
      <h3 class="settings-section-title">🖼️ 背景图片</h3>
      <div class="bg-upload-area" id="bgUploadArea">
        <input type="file" id="bgFileInput" accept="image/*" hidden />
        <div class="bg-preview-wrap" id="bgPreviewWrap" style="display:none">
          <img id="bgPreviewImg" src="" alt="背景预览" />
          <button class="bg-remove-btn" id="bgRemoveBtn" title="移除背景">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="bg-upload-hint" id="bgUploadHint">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><polyline points="21 15 16 10 5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p>选择背景图片</p>
          <span>支持 JPG、PNG、WebP</span>
        </div>
        <button class="bg-select-btn" id="bgSelectBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          选择图片
        </button>
      </div>

      <!-- Background sliders -->
      <div class="slider-group" id="bgSliders">
        <div class="slider-item">
          <div class="slider-label"><span>模糊度</span><span id="blurVal">8px</span></div>
          <input type="range" id="bgBlur" min="0" max="30" value="8" class="slider" />
        </div>
        <div class="slider-item">
          <div class="slider-label"><span>遮罩透明度</span><span id="overlayVal">60%</span></div>
          <input type="range" id="bgOverlayOpacity" min="0" max="95" value="60" class="slider" />
        </div>
      </div>
    </div>

    <!-- Layout -->
    <div class="settings-section">
      <h3 class="settings-section-title">📐 卡片大小</h3>
      <div class="card-size-group" id="cardSizeGroup">
        <button class="card-size-btn active" data-size="medium">中</button>
        <button class="card-size-btn" data-size="small">小</button>
        <button class="card-size-btn" data-size="large">大</button>
      </div>
    </div>

    <!-- Data -->
    <div class="settings-section">
      <h3 class="settings-section-title">🗃️ 数据管理</h3>
      <button class="danger-btn" id="clearAllBtn">清空所有数据</button>
    </div>
  </div>
</div>

<!-- ░░░ UPLOAD MODAL ░░░ -->
<div class="modal-backdrop" id="uploadModalBackdrop">
  <div class="modal" id="uploadModal">
    <div class="modal-header">
      <h2>📤 上传乐谱</h2>
      <button class="icon-btn" id="uploadModalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <div class="upload-zone-inner">
          <div class="upload-zone-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <p class="upload-zone-text">拖拽图片至此 或 <button class="link-btn" id="browseBtn">浏览文件</button></p>
          <p class="upload-zone-sub">支持 JPG、PNG、WebP、GIF，可多选</p>
        </div>
      </div>
      <div id="uploadPreviewList"></div>
      <div class="upload-form" id="uploadForm" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label for="uploadTitle">🏷️ 乐谱名称</label>
            <input type="text" id="uploadTitle" placeholder="为这张乐谱起个名字…" maxlength="50" />
          </div>
          <div class="form-group">
            <label for="uploadCategory">📂 所属分类</label>
            <select id="uploadCategory">
              <option value="">— 不分类 —</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="uploadComposer">🎼 作曲家 / 来源</label>
          <input type="text" id="uploadComposer" placeholder="如：贝多芬、肖邦、自创…" maxlength="50" />
        </div>
        <div class="form-group">
          <label for="uploadTags">🔖 标签（逗号分隔）</label>
          <input type="text" id="uploadTags" placeholder="如：钢琴, 古典, 练习曲…" />
          <div class="tag-suggestions" id="tagSuggestions"></div>
        </div>
        <div class="form-group">
          <label for="uploadNotes">📝 备注</label>
          <textarea id="uploadNotes" rows="2" placeholder="难度、演奏技巧等备注…"></textarea>
        </div>
        <div class="form-group">
          <label>🎵 难度</label>
          <div class="difficulty-group" id="difficultyGroup">
            <button class="diff-btn active" data-level="0">不设置</button>
            <button class="diff-btn" data-level="1">★ 入门</button>
            <button class="diff-btn" data-level="2">★★ 初级</button>
            <button class="diff-btn" data-level="3">★★★ 中级</button>
            <button class="diff-btn" data-level="4">★★★★ 高级</button>
            <button class="diff-btn" data-level="5">★★★★★ 专业</button>
          </div>
        </div>
        <!-- Multi-page Merge Option -->
        <div class="form-group merge-pages-group" id="mergePagesGroup" style="display:none">
          <label class="merge-toggle-card">
            <input type="checkbox" id="mergePagesCheck" checked />
            <span class="merge-checkbox-box"></span>
            <div class="merge-toggle-info">
              <span class="merge-toggle-title">📚 合并为一本多页乐谱</span>
              <span class="merge-toggle-desc">将选中的所有图片作为同一首乐谱的连续页（看谱时可顺畅翻页）</span>
            </div>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer" id="uploadModalFooter" style="display:none">
      <button class="btn-secondary" id="uploadCancel">取消</button>
      <button class="btn-primary" id="uploadConfirm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        保存乐谱
      </button>
    </div>
  </div>
</div>

<!-- ░░░ CATEGORY MODAL ░░░ -->
<div class="modal-backdrop" id="categoryModalBackdrop">
  <div class="modal modal-sm" id="categoryModal">
    <div class="modal-header">
      <h2 id="catModalTitle">新建分类</h2>
      <button class="icon-btn" id="categoryModalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="categoryName">分类名称</label>
        <input type="text" id="categoryName" placeholder="如：古典、流行、练习曲…" maxlength="20" />
      </div>
      <div class="form-group">
        <label>分类图标</label>
        <div class="emoji-picker" id="emojiPicker">
          <button class="emoji-btn active" data-emoji="🎵">🎵</button>
          <button class="emoji-btn" data-emoji="🎹">🎹</button>
          <button class="emoji-btn" data-emoji="🎸">🎸</button>
          <button class="emoji-btn" data-emoji="🎺">🎺</button>
          <button class="emoji-btn" data-emoji="🎻">🎻</button>
          <button class="emoji-btn" data-emoji="🥁">🥁</button>
          <button class="emoji-btn" data-emoji="🎷">🎷</button>
          <button class="emoji-btn" data-emoji="📖">📖</button>
          <button class="emoji-btn" data-emoji="⭐">⭐</button>
          <button class="emoji-btn" data-emoji="🏆">🏆</button>
          <button class="emoji-btn" data-emoji="📝">📝</button>
          <button class="emoji-btn" data-emoji="🎼">🎼</button>
        </div>
      </div>
      <div class="form-group">
        <label>颜色</label>
        <div class="color-picker" id="colorPicker">
          <button class="color-dot active" data-color="#a78bfa" style="background:#a78bfa"></button>
          <button class="color-dot" data-color="#60a5fa" style="background:#60a5fa"></button>
          <button class="color-dot" data-color="#34d399" style="background:#34d399"></button>
          <button class="color-dot" data-color="#fbbf24" style="background:#fbbf24"></button>
          <button class="color-dot" data-color="#f87171" style="background:#f87171"></button>
          <button class="color-dot" data-color="#fb923c" style="background:#fb923c"></button>
          <button class="color-dot" data-color="#e879f9" style="background:#e879f9"></button>
          <button class="color-dot" data-color="#2dd4bf" style="background:#2dd4bf"></button>
          <button class="color-dot" data-color="#94a3b8" style="background:#94a3b8"></button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="categoryCancel">取消</button>
      <button class="btn-primary" id="categoryConfirm">确认</button>
    </div>
  </div>
</div>

<!-- ░░░ ENHANCED IMAGE VIEWER ░░░ -->
<div class="viewer-backdrop" id="viewerBackdrop">
  <!-- Topbar -->
  <div class="viewer-topbar" id="viewerTopbar">
    <div class="viewer-info-wrap">
      <div class="viewer-title-row">
        <span class="viewer-title" id="viewerTitle"></span>
        <span class="viewer-page-tag" id="viewerPageTag" style="display:none">1/1</span>
      </div>
      <div class="viewer-meta-row">
        <span class="viewer-cat" id="viewerCat"></span>
        <span class="viewer-composer" id="viewerComposer"></span>
        <span class="viewer-diff" id="viewerDiff"></span>
      </div>
    </div>
    <div class="viewer-actions">
      <!-- 滤镜切换 -->
      <button class="viewer-btn" id="viewerFilterBtn" title="滤镜模式（原图/护眼/夜间反相/高对比）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
      <!-- 画笔标注 -->
      <button class="viewer-btn" id="viewerAnnotBtn" title="手绘与指法标注">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 2l7.586 7.586" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- 纯净全屏演奏 / 防息屏 -->
      <button class="viewer-btn" id="viewerStageBtn" title="纯净演奏模式（全屏+防息屏常亮）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="viewer-btn" id="viewerFav" title="收藏">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="viewer-btn" id="viewerEdit" title="编辑">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="viewer-btn" id="viewerDownload" title="下载当前乐谱">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="viewer-btn danger" id="viewerDelete" title="删除">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="viewer-btn" id="viewerClose" title="关闭 (Esc)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Filter Popup Dropdown -->
  <div class="filter-dropdown" id="filterDropdown">
    <div class="filter-dropdown-title">视觉与护眼滤镜</div>
    <button class="filter-opt active" data-filter="normal">
      <span class="filter-icon">🎨</span>
      <span class="filter-text">原图模式</span>
    </button>
    <button class="filter-opt" data-filter="sepia">
      <span class="filter-icon">📜</span>
      <span class="filter-text">护眼羊皮纸 (暖色防疲劳)</span>
    </button>
    <button class="filter-opt" data-filter="invert">
      <span class="filter-icon">🌙</span>
      <span class="filter-text">夜间黑底反相 (弱光不晃眼)</span>
    </button>
    <button class="filter-opt" data-filter="contrast">
      <span class="filter-icon">⚡</span>
      <span class="filter-text">高对比度锐化 (增强泛黄浅淡谱)</span>
    </button>
  </div>

  <!-- Annotation Floating Toolbar -->
  <div class="annot-toolbar" id="annotToolbar" style="display:none">
    <div class="annot-group">
      <button class="annot-tool-btn active" data-tool="pen" title="铅笔">✏️ 铅笔</button>
      <button class="annot-tool-btn" data-tool="highlighter" title="荧光高亮">🖍️ 荧光</button>
      <button class="annot-tool-btn" data-tool="eraser" title="橡皮擦">🧹 橡皮</button>
    </div>
    <div class="annot-sep"></div>
    <div class="annot-group" id="annotColorGroup">
      <button class="annot-color-dot active" data-color="#ef4444" style="background:#ef4444" title="红色"></button>
      <button class="annot-color-dot" data-color="#3b82f6" style="background:#3b82f6" title="蓝色"></button>
      <button class="annot-color-dot" data-color="#eab308" style="background:#eab308" title="黄色"></button>
      <button class="annot-color-dot" data-color="#22c55e" style="background:#22c55e" title="绿色"></button>
      <button class="annot-color-dot" data-color="#0f172a" style="background:#0f172a" title="黑色"></button>
    </div>
    <div class="annot-sep"></div>
    <div class="annot-group">
      <button class="annot-action-btn" id="annotUndoBtn" title="撤销上一笔">↩️</button>
      <button class="annot-action-btn" id="annotClearBtn" title="清空本页标注">🗑️</button>
      <button class="annot-done-btn" id="annotDoneBtn">完成</button>
    </div>
  </div>

  <!-- Viewer Body with Stage & Viewport -->
  <div class="viewer-body" id="viewerBody">
    <!-- Click zones for stage mode flip -->
    <div class="viewer-click-zone left" id="viewerZoneLeft" title="点击上一页"></div>
    <div class="viewer-click-zone center" id="viewerZoneCenter" title="点击呼出/隐藏工具栏"></div>
    <div class="viewer-click-zone right" id="viewerZoneRight" title="点击下一页"></div>

    <button class="viewer-nav-btn prev" id="viewerPrev" title="上一首乐谱">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="viewer-viewport" id="viewerViewport">
      <div class="viewer-stage-layer" id="viewerStageLayer">
        <img id="viewerImg" class="viewer-score-img" src="" alt="乐谱预览" draggable="false" />
        <canvas id="annotationCanvas" class="annotation-canvas"></canvas>
      </div>
    </div>

    <button class="viewer-nav-btn next" id="viewerNext" title="下一首乐谱">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- Floating Zoom Controls -->
    <div class="viewer-zoom-bar" id="viewerZoomBar">
      <button class="zoom-btn" id="zoomOutBtn" title="缩小 (-)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <button class="zoom-val-btn" id="zoomResetBtn" title="重置 100%">100%</button>
      <button class="zoom-btn" id="zoomInBtn" title="放大 (+)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <button class="zoom-btn" id="zoomFitBtn" title="适应窗口">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M15 3v18" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>

    <!-- Floating Multi-page Navigation Pill -->
    <div class="viewer-page-pill" id="viewerPagePill" style="display:none">
      <button class="page-pill-btn" id="pagePillPrev" title="上一页 (PageUp / ←)">‹</button>
      <span class="page-pill-text" id="pagePillText">第 1 / 1 页</span>
      <button class="page-pill-btn" id="pagePillNext" title="下一页 (PageDown / →)">›</button>
    </div>

    <!-- Stage Mode Hint Banner -->
    <div class="stage-mode-hint" id="stageModeHint">
      <span>💡 点击两侧翻页 · 点击中央呼出工具栏 · 屏幕常亮已启用</span>
    </div>
  </div>

  <div class="viewer-footer" id="viewerFooter">
    <div class="viewer-tags-wrap" id="viewerTags"></div>
    <div class="viewer-counter-wrap">
      <span class="viewer-counter" id="viewerCounter">1 / 1</span>
    </div>
  </div>
</div>

<!-- ░░░ EDIT MODAL ░░░ -->
<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal modal-sm" id="editModal">
    <div class="modal-header">
      <h2>✏️ 编辑乐谱信息</h2>
      <button class="icon-btn" id="editModalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="editTitle">🏷️ 乐谱名称</label>
        <input type="text" id="editTitle" maxlength="50" />
      </div>
      <div class="form-group">
        <label for="editComposer">🎼 作曲家 / 来源</label>
        <input type="text" id="editComposer" maxlength="50" />
      </div>
      <div class="form-group">
        <label for="editCategory">📂 分类</label>
        <select id="editCategory"><option value="">— 不分类 —</option></select>
      </div>
      <div class="form-group">
        <label for="editTags">🔖 标签（逗号分隔）</label>
        <input type="text" id="editTags" />
      </div>
      <div class="form-group">
        <label for="editNotes">📝 备注</label>
        <textarea id="editNotes" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>🎵 难度</label>
        <div class="difficulty-group" id="editDifficultyGroup">
          <button class="diff-btn active" data-level="0">不设置</button>
          <button class="diff-btn" data-level="1">★ 入门</button>
          <button class="diff-btn" data-level="2">★★ 初级</button>
          <button class="diff-btn" data-level="3">★★★ 中级</button>
          <button class="diff-btn" data-level="4">★★★★ 高级</button>
          <button class="diff-btn" data-level="5">★★★★★ 专业</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="editCancel">取消</button>
      <button class="btn-primary" id="editConfirm">保存</button>
    </div>
  </div>
</div>

<!-- ░░░ TOAST ░░░ -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
